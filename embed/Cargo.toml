[package]
name = "librespot-embed"
version = "0.8.0"
description = "Run librespot inside a host application, with no binary to exec"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
# `lib` so it can be driven from a normal Rust test on the desktop, `cdylib` so an
# Android app can load it with System.loadLibrary.
crate-type = ["lib", "cdylib"]

[dependencies]
librespot-core = { workspace = true }
librespot-connect = { workspace = true }
librespot-oauth = { workspace = true }
librespot-metadata = { workspace = true }
# Para el QR de vinculacion: sin features no arrastra `image`, solo la matriz.
qrcode = { version = "0.14", default-features = false }
# The http backend is not optional here: it is the only output this crate has, and
# `start` now waits on the port it serves, so its absence is a compile error rather
# than a crate that builds and then refuses to play.
librespot-playback = { workspace = true, features = ["http-backend"] }
data-encoding = "2"
log = "0.4"
sha1 = "0.10"
# Para elegir proveedor criptografico explicitamente: el arbol trae mas de uno y
# rustls se niega a adivinar.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"

[dev-dependencies]
env_logger = "0.11"

[features]
default = []
native-tls = ["librespot-core/native-tls", "librespot-oauth/native-tls"]
rustls-tls-webpki-roots = ["librespot-core/rustls-tls-webpki-roots", "librespot-oauth/rustls-tls-webpki-roots"]
cast = ["librespot-playback/cast"]
